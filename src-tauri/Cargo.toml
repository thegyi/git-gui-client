[package]
name = "git-gui-client"
version = "1.0.0"
description = "A GitKraken-like Git GUI client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "git_gui_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
keyring = "2"
ureq = "2"
base64 = "0.22"
